name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-and-test:
    name: build / check / lint / test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev pkg-config qemu-utils genisoimage gpgv

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Install Rust toolchain (nightly, for rustfmt)
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          components: rustfmt

      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'rust-toolchain', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: make build
        run: make build

      - name: make check
        run: make check

      - name: make lint
        run: make lint

      - name: make test
        run: make test

      - name: cargo build --workspace --examples
        run: cargo build --workspace --examples

      - name: make doc
        run: make doc

      - name: Install cargo-audit and cargo-deny
        run: cargo install cargo-audit cargo-deny

      - name: make audit
        run: make audit
